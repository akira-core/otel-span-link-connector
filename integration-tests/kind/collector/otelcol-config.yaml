receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.start_time
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.job.name
    pod_association:
      - sources:
          - from: connection

connectors:
  spanlinkservicegraph:
    metrics_flush_interval: 5s
    store:
      ttl: 30s
      max_items: 10000
    dimensions:
      - name: messaging_system
        source_attribute: messaging.system
      - name: messaging_destination
        source_attribute: messaging.destination
      - name: db_system
        source_attribute: db.system
      - name: db_namespace
        source_attribute: db.namespace
      - name: link_type
        source_attribute: link_type
      - name: k8s_pod_name
        source_attribute: k8s.pod.name
      - name: k8s_namespace_name
        source_attribute: k8s.namespace.name
      - name: k8s_job_name
        source_attribute: k8s.job.name

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics.default.svc.cluster.local:8428/api/v1/write
  debug:
    verbosity: basic

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes]
      exporters: [spanlinkservicegraph]
    metrics:
      receivers: [spanlinkservicegraph]
      exporters: [prometheusremotewrite, debug]
