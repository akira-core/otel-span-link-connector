apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: default
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          args: ["-retentionPeriod=1d", "-httpListenAddr=:8428"]
          ports:
            - containerPort: 8428
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: default
spec:
  selector:
    app: victoriametrics
  ports:
    - port: 8428
      targetPort: 8428
