# Job A: order-service (producer + consumer in-process with span links)
apiVersion: batch/v1
kind: Job
metadata:
  name: testapp-order-service
  namespace: default
  labels:
    app: testapp-phase1
    scenario: order-service
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: testapp-phase1
        scenario: order-service
    spec:
      restartPolicy: Never
      containers:
        - name: testapp
          image: testapp-phase1:latest
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: "order-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.default.svc.cluster.local:4317"
---
