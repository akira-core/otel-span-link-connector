apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.job.name
        pod_association:
          - sources:
              - from: connection

    connectors:
      spanlinkservicegraph:
        metrics_flush_interval: 5s
        store:
          ttl: 30s
          max_items: 10000
        dimensions:
          - name: messaging_system
            source_attribute: messaging.system
          - name: messaging_destination
            source_attribute: messaging.destination
          - name: db_system
            source_attribute: db.system
          - name: db_namespace
            source_attribute: db.namespace
          - name: link_type
            source_attribute: link_type
          - name: k8s_pod_name
            source_attribute: k8s.pod.name
          - name: k8s_namespace_name
            source_attribute: k8s.namespace.name
          - name: k8s_job_name
            source_attribute: k8s.job.name

    exporters:
      prometheusremotewrite:
        endpoint: http://victoriametrics.default.svc.cluster.local:8428/api/v1/write
      debug:
        verbosity: basic

    extensions:
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes]
          exporters: [spanlinkservicegraph]
        metrics:
          receivers: [spanlinkservicegraph]
          exporters: [prometheusremotewrite, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: default
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otelcol-spanlink-contrib:latest
          imagePullPolicy: Never
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 55679
              name: zpages
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: default
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: zpages
      port: 55679
      targetPort: 55679
